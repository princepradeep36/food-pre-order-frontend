<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Click2Eat Admin/Vendor</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 300px;
            text-align: center;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .error {
            color: red;
            font-size: 0.9rem;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <h2>System Login</h2>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Login</button>
        <div id="error" class="error">Invalid Credentials</div>
    </div>

    <script>
        const API = window.location.hostname === "localhost"
            ? "http://localhost:3000"
            : "https://food-pre-order-backend.onrender.com";

        async function login() {
            const username = document.getElementById("username").value;
            const pass = document.getElementById("password").value;
            const errDiv = document.getElementById("error");

            try {
                const res = await fetch(`${API}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password: pass })
                });

                if (!res.ok) throw new Error("Login failed");

                const data = await res.json();

                // Store minimal info (in real app, use secure cookie/token)
                sessionStorage.setItem("user_role", data.role);
                sessionStorage.setItem("vendor_id", data.vendor_id || "");

                if (data.role === 'admin') {
                    window.location.href = "admin.html?admin=true";
                } else if (data.role === 'vendor') {
                    window.location.href = `vendor.html?vendor_id=${data.vendor_id}`;
                }
            } catch (err) {
                errDiv.style.display = "block";
            }
        }
    </script>
</body>

</html>
