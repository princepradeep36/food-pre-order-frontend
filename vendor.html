<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click2Eat Vendor Portal</title>
    <style>
        :root {
            --primary: #007bff;
            --bg: #f4f7f9;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .logout-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #dc3545;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .container {
            width: 100%;
            max-width: 800px;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 40px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            text-decoration: none;
            color: #333;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        .icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .title {
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--primary);
        }

        .desc {
            font-size: 0.9rem;
            color: #666;
        }
    </style>
</head>

<body>
    <button class="logout-btn" onclick="logout()">Logout</button>
    <div class="container">
        <h1>Click2Eat Vendor Portal</h1>

        <div class="grid">
            <a href="#" id="dash-link" class="card">
                <div class="icon">🔔</div>
                <div class="title">Live Vendor Dashboard</div>
                <div class="desc">Real-time incoming orders for display</div>
            </a>

            <a href="#" id="sum-link" class="card">
                <div class="icon">📊</div>
                <div class="title">Sales Summary</div>
                <div class="desc">Total sales report by vendor and item</div>
            </a>
            <a href="#" id="menu-link" class="card">
                <div class="icon">🍔</div>
                <div class="title">Manage Menu</div>
                <div class="desc">Add or remove items from your menu</div>
            </a>
        </div>
    </div>

    <!-- Menu Management Section Removed -->

    <script src="auth.js"></script>
    <script>
        checkAuth('vendor');

        const API = window.location.hostname === "localhost"
            ? "http://localhost:3000"
            : "https://food-pre-order-backend.onrender.com";

        // Get Vendor ID from URL or Session
        const params = new URLSearchParams(window.location.search);
        let vendorId = params.get("vendor_id") || sessionStorage.getItem("vendor_id");

        if (!vendorId) {
            alert("No vendor ID found. Please login.");
            window.location.href = "login.html";
        }

        // Update Links
        document.getElementById("dash-link").href = `vendor-live.html?vendor_id=${vendorId}`;
        document.getElementById("sum-link").href = `vendor-stats.html?vendor_id=${vendorId}`;
        document.getElementById("menu-link").href = `vendor-menu.html?vendor_id=${vendorId}`;

        // Legacy menu script removed
    </script>

</html>
