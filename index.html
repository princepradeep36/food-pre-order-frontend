<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Hub - Click2Eat</title>
    <style>
        :root {
            --primary: #FF4757;
            /* Warm Foodie Red */
            --secondary: #2F3542;
            /* Deep Charcoal */
            --accent: #FFA502;
            /* Golden Orange */
            --success: #2ED573;
            /* Fresh Green */
            --bg: #F1F2F6;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            /* Subtle food-themed pattern */
            background-image: radial-gradient(#ced4da 0.5px, transparent 0.5px);
            background-size: 24px 24px;
            margin: 0;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .hub-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .logo-area {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        h1 {
            color: var(--secondary);
            font-size: 1.8rem;
            margin-bottom: 8px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            color: #747d8c;
            margin-bottom: 35px;
            font-size: 0.95rem;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 18px;
            margin-bottom: 16px;
            color: white;
            font-weight: 600;
            text-decoration: none;
            border-radius: 16px;
            font-size: 1rem;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-sizing: border-box;
        }

        .nav-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        .nav-btn:active {
            transform: scale(0.98);
        }

        .btn-order {
            background: var(--primary);
            box-shadow: 0 8px 20px rgba(255, 71, 87, 0.3);
        }

        .btn-pay {
            background: var(--accent);
            box-shadow: 0 8px 20px rgba(255, 165, 2, 0.3);
        }

        .btn-receipts {
            background: var(--success);
            box-shadow: 0 8px 20px rgba(46, 213, 115, 0.3);
        }

        .footer-text {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #a4b0be;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>

    <div class="hub-container">
        <div class="logo-area">🍽️</div>
        <h1>Click2Eat</h1>
        <p class="subtitle">Smart Booking Experience</p>

        <a href="menu.html" class="nav-btn btn-order">
            <span>✨</span> Create New Order
        </a>
        <a href="payment.html" class="nav-btn btn-pay">
            <span>💳</span> Pending Payments
        </a>
        <a href="receipts.html" class="nav-btn btn-receipts">
            <span>📄</span> My Receipts
        </a>

        <div class="footer-text">Powered by SmartDining 🚀</div>
    </div>

</body>

</html>
